name: Build APK

on:
  workflow_dispatch:        # GitHub → Actions → "Build APK" → Run workflow
  push:
    branches: [ main ]

jobs:
  apk:
    runs-on: ubuntu-latest
    env:
      KS_PASS: gpRelease2026
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: npm install
        run: npm install --no-audit --no-fund

      - name: Android प्रोजेक्ट बनवा
        run: npx cap add android

      - name: आपला Java कोड / आयकॉन / version टाका
        run: node scripts/prepare-android.js

      - name: Web फाईली Android मध्ये कॉपी (cap sync)
        run: npx cap sync android

      - name: Release APK बनवा (unsigned)
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Sign (सही) करा
        run: |
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          echo "build-tools: $BT"
          UNSIGNED=$(find android/app/build/outputs/apk/release -name '*.apk' | head -1)
          echo "unsigned: $UNSIGNED"
          "$BT/zipalign" -p -f 4 "$UNSIGNED" aligned.apk
          "$BT/apksigner" sign --ks signing/gp-release.p12 --ks-type PKCS12 \
            --ks-pass "pass:$KS_PASS" --ks-key-alias gp --key-pass "pass:$KS_PASS" \
            --out GramPanchayat.apk aligned.apk
          "$BT/apksigner" verify --verbose GramPanchayat.apk

      - uses: actions/upload-artifact@v4
        with:
          name: GramPanchayat-APK
          path: GramPanchayat.apk
